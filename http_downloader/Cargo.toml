[package]
name = "http_downloader"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
thiserror = "1.0"
futures = "0.3"
core_types = { path = "../core_types" }
flume = "0.12.0"
reqwest = { version = "0.13.3", features = ["stream"] }
tokio = "1.52.3"
urlencoding = "2.1.3"
sanitize-filename = "0.6.0"
tracing = "0.1"

[dev-dependencies]
axum = "0.8"
bytes = "1"
tempfile = "3"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
